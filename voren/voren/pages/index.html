<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voren — Intro</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      background: #030507;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       INTRO PRINCIPAL
       ========================= */

    .intro {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;

      background:
        radial-gradient(
          circle at center,
          rgba(70, 95, 125, 0.18) 0%,
          rgba(8, 11, 16, 0.85) 35%,
          #020304 75%
        );
    }

    /* =========================
       PARTÍCULAS
       ========================= */

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .particle {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;

      animation: particleMove linear infinite;
    }

    @keyframes particleMove {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.4);
      }

      20% {
        opacity: 0.6;
      }

      80% {
        opacity: 0.15;
      }

      100% {
        opacity: 0;
        transform: translateY(-100px) scale(1);
      }
    }

    /* =========================
       ANEL TECNOLÓGICO
       ========================= */

    .tech-ring {
      position: absolute;
      width: min(70vw, 620px);
      height: min(70vw, 620px);

      border-radius: 50%;
      border: 1px solid rgba(160, 190, 220, 0.12);

      opacity: 0;
      z-index: 1;
    }

    .tech-ring::before {
      content: "";
      position: absolute;
      inset: -1px;

      border-radius: 50%;

      border-top: 1px solid rgba(220, 235, 255, 0.7);
      border-right: 1px solid rgba(220, 235, 255, 0.25);

      animation: ringRotate 5s linear infinite;
    }

    .tech-ring::after {
      content: "";
      position: absolute;

      width: 8px;
      height: 8px;

      top: 0;
      left: 50%;

      border-radius: 50%;

      background: white;

      box-shadow:
        0 0 10px white,
        0 0 25px rgba(100, 170, 255, 0.8);
    }

    .tech-ring.active {
      animation: ringAppear 0.8s ease forwards;
    }

    @keyframes ringAppear {
      from {
        opacity: 0;
        transform: scale(0.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes ringRotate {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       FLASH DE LUZ
       ========================= */

    .light-line {
      position: absolute;

      width: 0;
      height: 2px;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: white;
      opacity: 0;

      box-shadow:
        0 0 8px white,
        0 0 25px rgba(150, 200, 255, 0.9),
        0 0 80px rgba(80, 150, 255, 0.6);
    }

    .light-line.active {
      animation: lightFlash 0.7s ease forwards;
    }

    @keyframes lightFlash {
      0% {
        width: 0;
        opacity: 0;
      }

      35% {
        width: 40vw;
        opacity: 1;
      }

      100% {
        width: 110vw;
        opacity: 0;
      }
    }

    /* =========================
       DADOS TECNOLÓGICOS
       ========================= */

    .data {
      position: absolute;

      color: rgba(190, 215, 240, 0.25);

      font-size: 9px;
      letter-spacing: 3px;

      opacity: 0;

      animation: dataAppear 1s ease forwards;
    }

    .data-1 {
      top: 20%;
      left: 12%;
      animation-delay: 1.4s;
    }

    .data-2 {
      bottom: 25%;
      right: 12%;
      animation-delay: 1.7s;
    }

    .data-3 {
      top: 30%;
      right: 10%;
      animation-delay: 2s;
    }

    @keyframes dataAppear {
      to {
        opacity: 1;
      }
    }

    /* =========================
       CONTEÚDO CENTRAL
       ========================= */

    .content {
      position: relative;
      z-index: 3;

      text-align: center;

      opacity: 0;

      transform: scale(0.85);
    }

    .content.active {
      animation:
        contentShow 0.7s cubic-bezier(.16, 1, .3, 1) forwards;
    }

    @keyframes contentShow {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       LOGO V
       ========================= */

    .logo-v {
      width: 120px;
      height: 105px;

      margin: 0 auto 15px;

      position: relative;

      filter:
        drop-shadow(0 0 7px rgba(255,255,255,0.9))
        drop-shadow(0 0 25px rgba(120,180,255,0.5));

      animation:
        floatLogo 2.5s ease-in-out infinite;
    }

    .logo-v::before,
    .logo-v::after {
      content: "";

      position: absolute;
      top: 0;

      width: 48px;
      height: 100px;

      background:
        linear-gradient(
          135deg,
          #ffffff 0%,
          #d5dde8 45%,
          #78899d 100%
        );
    }

    .logo-v::before {
      left: 18px;

      clip-path:
        polygon(
          0 0,
          100% 0,
          70% 100%,
          38% 100%
        );

      transform: skewY(22deg);
    }

    .logo-v::after {
      right: 18px;

      clip-path:
        polygon(
          0 0,
          100% 0,
          62% 100%,
          30% 100%
        );

      transform: skewY(-22deg);
    }

    @keyframes floatLogo {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    /* =========================
       NOME VOREN
       ========================= */

    .brand {
      font-size:
        clamp(3.5rem, 10vw, 7rem);

      letter-spacing: 0.22em;
      padding-left: 0.22em;

      font-weight: 800;

      color: #eef4fa;

      line-height: 1;

      opacity: 0;

      transform:
        translateY(15px);

      text-shadow:
        0 0 5px rgba(255,255,255,0.8),
        0 0 30px rgba(120,170,220,0.4);
    }

    .content.active .brand {
      animation:
        brandShow 0.5s 0.2s ease forwards;
    }

    @keyframes brandShow {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       SLOGANS
       ========================= */

    .slogan {
      margin-top: 20px;

      font-size:
        clamp(0.65rem, 1.5vw, 0.9rem);

      letter-spacing: 0.3em;
      padding-left: 0.3em;

      color:
        rgba(240, 245, 250, 0.9);

      opacity: 0;

      transform:
        translateY(10px);
    }

    .content.active .slogan {
      animation:
        sloganShow 0.5s 0.55s ease forwards;
    }

    .sub-slogan {
      margin-top: 9px;

      font-size:
        clamp(0.5rem, 1vw, 0.7rem);

      letter-spacing: 0.45em;
      padding-left: 0.45em;

      color:
        rgba(180, 195, 210, 0.65);

      opacity: 0;

      transform:
        translateY(10px);
    }

    .content.active .sub-slogan {
      animation:
        sloganShow 0.5s 0.8s ease forwards;
    }

    @keyframes sloganShow {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       BARRA DE PROGRESSO
       ========================= */

    .progress-container {
      position: absolute;

      bottom: 45px;
      left: 50%;

      transform:
        translateX(-50%);

      width:
        min(220px, 55vw);

      height: 2px;

      background:
        rgba(255, 255, 255, 0.12);

      overflow: hidden;

      opacity: 0;

      animation:
        progressAppear 0.4s 0.5s forwards;
    }

    .progress {
      width: 0;
      height: 100%;

      background: #eef4fa;

      box-shadow:
        0 0 8px white,
        0 0 20px rgba(130, 180, 255, 0.8);
    }

    .progress.active {
      animation:
        progressLoad 10s linear forwards;
    }

    @keyframes progressAppear {
      to {
        opacity: 1;
      }
    }

    @keyframes progressLoad {
      from {
        width: 0;
      }

      to {
        width: 100%;
      }
    }

    /* =========================
       FECHAMENTO CINEMATOGRÁFICO
       ========================= */

    .content.closing {
      animation:
        closeContent 2s cubic-bezier(.4, 0, .2, 1) forwards;
    }

    @keyframes closeContent {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      45% {
        opacity: 1;
        transform: scale(0.92);
      }

      100% {
        opacity: 0;
        transform: scale(0);
      }
    }

    .tech-ring.closing {
      animation:
        closeRing 2s cubic-bezier(.7, 0, .2, 1) forwards;
    }

    @keyframes closeRing {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(0);
      }
    }

    .intro.closing {
      animation:
        darkenScreen 2s ease forwards;
    }

    @keyframes darkenScreen {
      to {
        filter: brightness(0);
      }
    }

    /* =========================
       VINHETA
       ========================= */

    .vignette {
      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 5;

      background:
        radial-gradient(
          circle,
          transparent 25%,
          rgba(0,0,0,0.35) 70%,
          rgba(0,0,0,0.9) 100%
        );
    }

    /* =========================
       RESPONSIVIDADE
       ========================= */

    @media (max-width: 600px) {

      .logo-v {
        transform: scale(0.8);
        margin-bottom: 5px;
      }

      .brand {
        letter-spacing: 0.15em;
        padding-left: 0.15em;
      }

      .slogan {
        line-height: 1.7;
      }

      .data {
        font-size: 6px;
      }

    }

  </style>

</head>

<body>

  <main class="intro" id="intro">

```
<div
  class="particles"
  id="particles">
</div>


<!-- ANEL -->

<div
  class="tech-ring"
  id="techRing">
</div>


<!-- FLASH -->

<div
  class="light-line"
  id="lightLine">
</div>


<!-- DADOS -->

<div class="data data-1">
  SUBSCRIPTIONS — ACTIVE
</div>

<div class="data data-2">
  FINANCIAL CONTROL — ONLINE
</div>

<div class="data data-3">
  VOREN SYSTEM — READY
</div>


<!-- CONTEÚDO -->

<div
  class="content"
  id="content">

  <div class="logo-v"></div>

  <h1 class="brand">
    VOREN
  </h1>

  <p class="slogan">
    ORGANIZE SUAS ASSINATURAS.
  </p>

  <p class="sub-slogan">
    CONTROLE SEU DINHEIRO.
  </p>

</div>


<!-- PROGRESSO -->

<div class="progress-container">

  <div
    class="progress"
    id="progress">
  </div>

</div>


<!-- VINHETA -->

<div class="vignette"></div>
```

  </main>

  <script>

    const intro =
      document.getElementById("intro");

    const particles =
      document.getElementById("particles");

    const lightLine =
      document.getElementById("lightLine");

    const techRing =
      document.getElementById("techRing");

    const content =
      document.getElementById("content");

    const progress =
      document.getElementById("progress");


    /* =========================
       CRIAR PARTÍCULAS
       ========================= */

    for (let i = 0; i < 100; i++) {

      const particle =
        document.createElement("span");

      particle.classList.add("particle");

      particle.style.left =
        Math.random() * 100 + "%";

      particle.style.top =
        Math.random() * 100 + "%";

      const size =
        Math.random() * 2 + 1;

      particle.style.width =
        size + "px";

      particle.style.height =
        size + "px";

      particle.style.animationDuration =
        3 + Math.random() * 4 + "s";

      particle.style.animationDelay =
        Math.random() * 3 + "s";

      particles.appendChild(particle);

    }


    /* =========================
       SEQUÊNCIA DA INTRO
       ========================= */


    /* 0.2s — barra */

    setTimeout(() => {

      progress.classList.add("active");

    }, 200);


    /* 0.5s — flash */

    setTimeout(() => {

      lightLine.classList.add("active");

    }, 500);


    /* 1s — anel */

    setTimeout(() => {

      techRing.classList.add("active");

    }, 1000);


    /* 1.4s — conteúdo */

    setTimeout(() => {

      content.classList.add("active");

    }, 1400);


    /* =========================
       FECHAMENTO
       ========================= */


    /*
      7s — A INTRO COMEÇA
      A SE FECHAR PARA O CENTRO
    */

    setTimeout(() => {

      intro.classList.add("closing");

      content.classList.add("closing");

      techRing.classList.add("closing");

    }, 7000);


    /*
      9.7s — REDIRECIONA
      PARA A TELA DE LOGIN
    */

    setTimeout(() => {

      window.location.href =
        "login.html";

    }, 9700);

  </script>

</body>
</html>
